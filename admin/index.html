<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>photo archive admin</title>
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <header>
    <h1>photo archive</h1>
    <div class="header-actions"><button id="review-button" type="button" disabled>review changes <span id="draft-count">0</span></button><div class="header-state"><span id="result-count">loading</span><span class="status-dot"></span>local</div></div>
  </header>
  <main>
    <aside>
      <div class="library-views" aria-label="Library view">
        <button id="view-shoots" class="active" type="button">shoots</button>
        <button id="view-all" type="button">all photos</button>
        <button id="view-issues" type="button">problems <span id="problem-count">0</span></button>
      </div>
      <div id="shoots-panel"><div class="aside-title">shoots</div><nav id="shoots"></nav></div>
    </aside>
    <section class="library">
      <div class="toolbar">
        <div>
          <h2 id="shoot-title">select a shoot</h2>
          <p id="shoot-meta"></p>
        </div>
        <div class="toolbar-actions">
          <div id="selection-actions" class="selection-actions" hidden><span id="selection-count"></span><button id="select-publish" type="button">publish</button><button id="select-hide" type="button">remove from site</button><button id="clear-selection" type="button">clear</button></div>
          <label><span>show</span><select id="visibility-filter"><option value="all">all photos</option><option value="published">published</option><option value="hidden">not published</option></select></label>
          <input id="tag-filter" type="search" placeholder="filter tags" aria-label="Filter tags">
        </div>
      </div>
      <div id="empty" class="empty">choose a shoot from the left</div>
      <div id="grid" class="photo-grid" aria-live="polite"></div>
    </section>
  </main>
  <template id="photo-template">
    <div class="photo-card">
      <label class="select-photo"><input type="checkbox"><span></span></label>
      <button class="photo-open" type="button">
        <div class="photo-wrap"><img alt="" loading="lazy"><span class="publish-state"></span><span class="pending-state">pending</span></div>
        <div class="photo-info"><div class="photo-name"></div><div class="issue-list"></div><div class="tag-list"></div></div>
      </button>
    </div>
  </template>
  <dialog id="editor">
    <form method="dialog" id="editor-form">
      <div class="editor-topbar"><div><span class="eyebrow">edit photo</span><h2 id="editor-name"></h2></div><button class="icon-button" value="cancel" aria-label="Close">×</button></div>
      <div class="editor-layout">
        <div class="editor-image"><img id="editor-image" alt=""></div>
        <div class="editor-fields">
          <label class="publish-toggle"><input id="editor-published" type="checkbox"><span>published on site</span></label>
          <label class="field"><span>description</span><textarea id="editor-description" rows="3"></textarea></label>
          <div class="field-row">
            <label class="field"><span>framing</span><select id="editor-shot"><option value="unknown">unknown</option><option value="detail">detail</option><option value="extreme-close-up">extreme close up</option><option value="close-up">close up</option><option value="medium">medium</option><option value="wide">wide</option><option value="extreme-wide">extreme wide</option></select></label>
            <label class="field"><span>people</span><input id="editor-people" type="number" min="0" max="100"></label>
          </div>
          <div class="tag-editor"><div class="field-heading"><span>manual tags</span><button id="promote-all" type="button">make all manual</button></div><div id="manual-tags" class="editable-tags"></div></div>
          <div class="add-tag"><input id="new-tag" placeholder="new manual tag"><button id="add-tag" type="button">add</button></div>
          <div class="tag-editor"><div class="field-heading"><span>generated tags</span><small>click to make manual</small></div><div id="generated-tags" class="editable-tags generated"></div></div>
        </div>
      </div>
      <div class="editor-actions"><span id="save-status"></span><button class="secondary" value="cancel">cancel</button><button id="save-photo" type="button">save metadata</button></div>
    </form>
  </dialog>
  <dialog id="review-dialog" class="review-dialog">
    <div class="review-shell">
      <div class="editor-topbar"><div><span class="eyebrow">changes to sync</span><h2>review changes</h2></div><button id="close-review" class="icon-button" type="button" aria-label="Close review">×</button></div>
      <div id="review-list" class="review-list"></div>
      <div class="review-actions"><span id="apply-status">Nothing has been changed yet.</span><button id="discard-all" class="secondary" type="button">discard publication changes</button><button id="apply-changes" type="button">apply &amp; publish</button></div>
    </div>
  </dialog>
  <dialog id="publish-dialog" class="publish-dialog">
    <div class="publish-shell">
      <div class="editor-topbar"><div><span class="eyebrow">site publication</span><h2 id="publish-title">publishing…</h2></div><button id="close-publish" class="icon-button" type="button" aria-label="Close publication log" disabled>×</button></div>
      <pre id="publish-log" aria-live="polite"></pre>
      <div class="publish-actions"><span id="publish-result">Please keep this window open.</span><button id="finish-publish" type="button" disabled>close</button></div>
    </div>
  </dialog>
  <script src="/assets/app.js"></script>
</body>
</html>
